x-logging-json: &logging_json
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-common-secure: &common_secure
  init: true
  stop_grace_period: "30s"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs: [ /tmp ]
  logging: *logging_json
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hh}
      POSTGRES_USER: ${POSTGRES_USER:-hh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hh}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-hh} -d ${POSTGRES_DB:-hh}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: []
    cap_drop: []
    read_only: true
    tmpfs: []
    init: true
    restart: unless-stopped
    logging: *logging_json

  cache:
    image: redis:7-alpine
    command: ["redis-server","--save","60","1","--loglevel","warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: []
    cap_drop: []
    read_only: true
    tmpfs: []
    init: true
    restart: unless-stopped
    logging: *logging_json

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file: [ ./.env ]
    working_dir: "/app/HH бот"
    environment:
      PYTHONPATH: "/app:/app/HH бот"
      TZ: ${TZ:-UTC}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASS:-admin}
      ADMIN_SECRET_TOKEN: ${ADMIN_SECRET_TOKEN:-dev-token}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-hh}:${POSTGRES_PASSWORD:-hh}@db:5432/${POSTGRES_DB:-hh}}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-not-secret}
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_PORT: ${WEB_PORT:-8000}
      APP_MODULE: ${APP_MODULE:-backend.app.main:app}
      APP_VERSION: ${APP_VERSION:-dev}
    command: ["sh","-lc","python -m uvicorn $${APP_MODULE} --host 0.0.0.0 --port $${WEB_PORT}"]
    expose: [ "8000" ]
    volumes:
      - web_logs:/var/log/app
      - resumes:/app/media/resumes
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://127.0.0.1:${WEB_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
    <<: *common_secure
    read_only: true
    tmpfs: [ /tmp ]

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    env_file: [ ./.env ]
    working_dir: "/app/HH бот"
    entrypoint: ["/bin/bash","-lc","exec \"/app/HH бот/bot/entrypoint.sh\""]
    environment:
      PYTHONPATH: "/app:/app/HH бот"
      TZ: ${TZ:-UTC}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_TOKEN: ${BOT_TOKEN:-${TELEGRAM_BOT_TOKEN}}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin}
      ADMIN_SECRET_TOKEN: ${ADMIN_SECRET_TOKEN:-dev-token}
      SECRET_KEY: ${SECRET_KEY:-dev-not-secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-hh}:${POSTGRES_PASSWORD:-hh}@db:5432/${POSTGRES_DB:-hh}}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}
      BOT_LOG_DIR: /var/log/app
      BOT_LOG_FILE: /var/log/app/bot.log
    volumes:
      - botlogs:/var/log/app
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        - |
          cat <<'PY' | python -
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          import redis.asyncio as aioredis


          async def main():
              engine = create_async_engine(os.environ['DATABASE_URL'], future=True)
              async with engine.connect() as conn:
                  await conn.execute(text('SELECT 1'))
              redis_url = os.environ.get('REDIS_URL')
              if redis_url:
                  client = aioredis.from_url(redis_url)
                  try:
                      await client.ping()
                  finally:
                      await client.aclose()

          asyncio.run(main())
          PY
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    <<: *common_secure
    read_only: true
    tmpfs: [ /tmp ]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web: { condition: service_healthy }
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ "ALL" ]
    cap_add: [ "NET_BIND_SERVICE","CHOWN","SETUID","SETGID" ]
    security_opt: [ "no-new-privileges:true" ]
    command: >
      sh -lc 'set -eu;
              for d in client_temp proxy_temp fastcgi_temp uwsgi_temp scgi_temp; do
                mkdir -p "/var/cache/nginx/$$d";
                chmod 0777 "/var/cache/nginx/$$d";
              done;
              exec nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging_json

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel","--no-autoupdate","run","--token","${CF_TUNNEL_TOKEN}"]
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      - nginx
    network_mode: "service:nginx"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging_json

volumes:
  pgdata:
  redisdata:
  botlogs:
  web_logs:
  resumes:
