version: "3.9"

x-logging-json: &logging_json
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-common-secure: &common_secure
  init: true
  stop_grace_period: "30s"
  security_opt:
    - no-new-privileges:true
  cap_drop: ["ALL"]
  read_only: true
  tmpfs:
    - /tmp
  logging: *logging_json
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hh}
      POSTGRES_USER: ${POSTGRES_USER:-hh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hh}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hh} -d ${POSTGRES_DB:-hh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common_secure
    # БД должна быть writable:
    read_only: false
    tmpfs: []

  cache:
    image: redis:7-alpine
    command: ["redis-server","--save","60","1","--loglevel","warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common_secure
    # Redis пишет снапшоты:
    read_only: false
    tmpfs: []

  web:
    # Гибрид: и image, и build (для локалки можно билдить; на проде обычно только pull)
    image: ${WEB_IMAGE:-ghcr.io/HOT-DOG-hash/hh-bot-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file:
      - ./.env
    working_dir: "/app/HH бот"
    environment:
      PYTHONPATH: "/app:/app/HH бот"
      TZ: ${TZ:-UTC}

      # BasicAuth (единые имена)
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASS:-admin}

      # Надёжные дефолты (исправлен лишний '}')
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-hh}:${POSTGRES_PASSWORD:-hh}@db:5432/${POSTGRES_DB:-hh}}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-not-secret}
      ADMIN_SECRET_TOKEN: ${ADMIN_SECRET_TOKEN:-dev-token}
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_PORT: ${WEB_PORT:-8000}
      APP_MODULE: ${APP_MODULE:-backend.app.main:app}
    command:
      - sh
      - -lc
      - "python -m uvicorn $${APP_MODULE} --host 0.0.0.0 --port $${WEB_PORT}"
    expose:
      - "8000"
    volumes:
      - web_logs:/var/log/app
    healthcheck:
      # Минимальный TCP-check (не зависит от роутинга в коде)
      test: ["CMD","python","-c","import os,socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', int(os.getenv('WEB_PORT','8000')))); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    <<: *common_secure
    # web пишет логи в volume:
    read_only: false
    tmpfs:
      - /tmp

  bot:
    image: ${BOT_IMAGE:-ghcr.io/HOT-DOG-hash/hh-bot-bot:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    env_file:
      - ./.env
    working_dir: "/app/HH бот"
    entrypoint:
      - /bin/bash
      - -lc
      - 'exec "/app/HH бот/bot/entrypoint.sh"'
    environment:
      PYTHONPATH: "/app:/app/HH бот"
      TZ: ${TZ:-UTC}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_TOKEN: ${BOT_TOKEN:-${TELEGRAM_BOT_TOKEN}}

      # Исправлен лишний '}'
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-hh}:${POSTGRES_PASSWORD:-hh}@db:5432/${POSTGRES_DB:-hh}}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}

      BOT_LOG_DIR: /var/log/app
      BOT_LOG_FILE: /var/log/app/bot.log
    volumes:
      - botlogs:/var/log/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'pgrep -f \"bot/runner.py\" >/dev/null'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common_secure
    # бот пишет логи в volume:
    read_only: false
    tmpfs:
      - /tmp

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./adminka_dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common_secure
    # nginx должен читать конфиг/слушать сокеты:
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  redisdata:
  botlogs:
  web_logs:
