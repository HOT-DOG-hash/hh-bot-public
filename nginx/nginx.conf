# Nginx reverse proxy for hh-bot (Допущение: сертификаты размещены в /etc/letsencrypt/live/hhoffer.ru)
user  nginx;
worker_processes auto;

pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json '{ "t":"$time_local","ip":"$remote_addr","req":"$request","st":$status,"rt":$request_time }';
  access_log  /dev/stdout json;

  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  types_hash_max_size 2048;

  client_max_body_size 25m;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Cloudflare real IP ranges (Допущение: актуализировать при изменении CF)
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  map $http_x_forwarded_proto $proxy_xfp { default $http_x_forwarded_proto; "" $scheme; }

  limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/m;
  limit_req_status 429;

  resolver 1.1.1.1 1.0.0.1 valid=300s;
  resolver_timeout 5s;

  upstream backend_web {
    server web:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name hhoffer.ru;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name hhoffer.ru;

    ssl_certificate     /etc/letsencrypt/live/hhoffer.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hhoffer.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hhoffer.ru/chain.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers on;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    location = /robots.txt {
      default_type text/plain;
      return 200 "User-agent: *\nDisallow: /admin/\n";
    }

    location /admin/ {
      auth_basic "Protected";
      auth_basic_user_file /etc/nginx/.htpasswd;
      limit_req zone=admin_limit burst=10 nodelay;

      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-store" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;

      root /usr/share/nginx/html;
      try_files $uri /admin/index.html;

      location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
      }
    }

    location /api/ {
      proxy_pass http://backend_web/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_xfp;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    location = /webhook {
      proxy_pass http://backend_web/webhook;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_xfp;
      proxy_connect_timeout 5s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;

      location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|jpg|jpeg|png|webp|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
      }
    }
  }
}
