user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  # --- базовая настройка логов/типов ---
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json_combined escape=json
    '{ "time_local":"$time_local",'
    '  "remote_addr":"$remote_addr",'
    '  "request":"$request",'
    '  "status":$status,'
    '  "body_bytes_sent":$body_bytes_sent,'
    '  "http_referer":"$http_referer",'
    '  "http_user_agent":"$http_user_agent",'
    '  "request_time":$request_time,'
    '  "upstream_response_time":"$upstream_response_time",'
    '  "upstream_addr":"$upstream_addr" }';

  access_log  /var/log/nginx/access.log  json_combined;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;
  server_tokens off;

  # --- gzip ---
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml text/javascript image/svg+xml;

  # --- проксирование и websocket ---
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # --- rate limit (в т.ч. для /admin) ---
  # Для /admin: 3 запроса/с с буфером на всплески до 10 запросов
  limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=3r/s;
  # Общий лимит (если захочешь завести для public API)
  # limit_req_zone $binary_remote_addr zone=public_zone:50m rate=10r/s;

  upstream backend_web {
    server web:8000;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    server_name _;

    # локальный health для контейнера nginx
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # безопасные заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    # CSP очень легко что-то сломать — по умолчанию не включаем.
    # add_header Content-Security-Policy "default-src 'self';" always;

    # проксирование на FastAPI
    location / {
      proxy_pass http://backend_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # websocket/upgrade
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_read_timeout 60s;
      proxy_send_timeout 60s;

      # если хочешь общую «публичную» квоту:
      # limit_req zone=public_zone burst=20 nodelay;
    }

    # /admin — BasicAuth + rate limit
    location ^~ /admin/ {
      # BasicAuth — указываем файл паролей
      auth_basic "Restricted";
      auth_basic_user_file /etc/nginx/.htpasswd;

      # rate limit для защиты от брутфорса / DDoS на админ-ручки
      limit_req zone=admin_zone burst=10 nodelay;

      proxy_pass http://backend_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
