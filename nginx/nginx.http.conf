user  nginx;
worker_processes  auto;

pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json '{ "t":"$time_local","ip":"$remote_addr","req":"$request","st":$status,"rt":$request_time }';
  access_log  /dev/stdout json;

  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  types_hash_max_size 2048;

  client_max_body_size 10m;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=3r/s;

  upstream backend_web { server web:8000; keepalive 32; }

  server {
    listen 80 default_server;
    server_name hhoffer.ru www.hhoffer.ru;

    location = /healthz { default_type text/plain; return 200 "ok"; }

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
    }

    location /admin/ {
      auth_basic "Restricted";
      auth_basic_user_file /etc/nginx/.htpasswd;
      limit_req zone=admin_zone burst=10 nodelay;

      root /usr/share/nginx/html;
      try_files $uri /admin/index.html;

      location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
      }
    }

    location /oauth/hh/ {
      proxy_pass http://backend_web$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    location /billing/ {
      proxy_pass http://backend_web$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    location /jobs/ {
      proxy_pass http://backend_web$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }
    location /api/ {
      proxy_pass http://backend_web/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;

      location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|jpg|jpeg|png|webp|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
      }
    }
  }
}
