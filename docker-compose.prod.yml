x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-common-secure: &common_secure
  init: true
  stop_grace_period: "30s"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs: [ /tmp ]
  restart: unless-stopped
  logging: *default-logging

services:
  db:
    <<: *common_secure
    image: postgres:16-alpine
    env_file: [ .env.prod ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: false
    cap_drop: []
    security_opt: []

  cache:
    <<: *common_secure
    image: redis:7-alpine
    command: ["redis-server","--save","60","1","--loglevel","warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: false
    cap_drop: []
    security_opt: []

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    # image: ghcr.io/<ORG>/hh-bot-web:latest
    env_file: [ .env.prod ]
    environment:
      PYTHONPATH: "/app:/app/HH бот:/app/backend"
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_PORT: ${WEB_PORT:-8000}
      APP_MODULE: ${APP_MODULE:-backend.app.main:app}
      BASE_URL: ${BASE_URL:-https://api.hhoffer.ru}
      BACKEND_URL: ${BACKEND_URL:-https://api.hhoffer.ru}
      OAUTH_HH_REDIRECT: ${OAUTH_HH_REDIRECT:-https://api.hhoffer.ru/oauth/hh/callback}
      OAUTH_HH_REDIRECT_URI: ${OAUTH_HH_REDIRECT_URI:-https://api.hhoffer.ru/oauth/hh/callback}
      PREMIUM_ENABLED: "1"
      PAYMENT_PROVIDER: yoomoney
      LOG_FILE: /var/log/app/app.log
    expose: [ "8000" ]
    volumes:
      - web_logs:/var/log/app
      - resumes:/app/media/resumes
    secrets:
      - source: hh_client_id
        target: hh_client_id
      - source: hh_client_secret
        target: hh_client_secret
      - source: yoomoney_client_id
        target: yoomoney_client_id
      - source: yoomoney_client_secret
        target: yoomoney_client_secret
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      db:    { condition: service_healthy }
      cache: { condition: service_healthy }
    <<: *common_secure

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    # image: ghcr.io/<ORG>/hh-bot-bot:latest
    env_file: [ .env.prod ]
    environment:
      PYTHONPATH: "/app:/app/HH бот:/app/backend"
      BOT_LOG_DIR: /var/log/app
      BOT_LOG_FILE: /var/log/app/bot.log
      BOT_SKIP_ENV_SOURCE: "1"
      BACKEND_URL: http://web:8000
      PAYMENT_PROVIDER: yoomoney
      LOG_FILE: /var/log/app/app.log
    entrypoint: ["/bin/bash","-lc","exec \"/app/HH бот/bot/entrypoint.sh\""]
    volumes:
      - botlogs:/var/log/app
    secrets:
      - source: hh_client_id
        target: hh_client_id
      - source: hh_client_secret
        target: hh_client_secret
      - source: yoomoney_client_id
        target: yoomoney_client_id
      - source: yoomoney_client_secret
        target: yoomoney_client_secret
    depends_on:
      db:    { condition: service_healthy }
      cache: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        - |
          cat <<'PY' | python -
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          import redis.asyncio as aioredis


          async def main():
              engine = create_async_engine(os.environ['DATABASE_URL'], future=True)
              async with engine.connect() as conn:
                  await conn.execute(text('SELECT 1'))
              redis_url = os.environ.get('REDIS_URL')
              if redis_url:
                  client = aioredis.from_url(redis_url)
                  try:
                      await client.ping()
                  finally:
                      await client.aclose()

          asyncio.run(main())
          PY
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    <<: *common_secure
    read_only: false
    cap_drop: []
    security_opt: []

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web: { condition: service_healthy }
    # Порт открыт только на localhost: внешний трафик идёт через Cloudflare Tunnel
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.http.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    command: >
      sh -lc 'set -eu;
              for d in client_temp proxy_temp fastcgi_temp uwsgi_temp scgi_temp; do
                mkdir -p "/var/cache/nginx/$$d";
                chmod 0777 "/var/cache/nginx/$$d";
              done;
              exec nginx -g "daemon off;"'
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "--edge-ip-version",
        "4",
        "--protocol",
        "http2",
        "--ha-connections",
        "4",
        "--metrics",
        "0.0.0.0:20241",
        "run",
        "--token-file",
        "/run/secrets/cf_tunnel_token"
      ]
    environment:
      TUNNEL_LOGLEVEL: info
      TUNNEL_TRANSPORT_LOGLEVEL: error
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    # healthcheck без /bin/sh внутри образа
    healthcheck:
      test: ["CMD","/bin/sh","-c","grep -q 'Registered tunnel connection' /proc/1/fd/1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    # подключаем секрет как файл
    secrets:
      - source: cf_tunnel_token
        target: cf_tunnel_token
    # чуть жёстче по безопасности (опционально)
    read_only: true
    pids_limit: 128
    tmpfs:
      - /tmp
      - /var/tmp
    # лог-лимиты (опционально)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Определение секрета (файл лежит у тебя локально)
secrets:
  cf_tunnel_token:
    file: ./secrets/cf_tunnel_token.txt
  hh_client_id:
    file: ./secrets/hh_client_id.txt
  hh_client_secret:
    file: ./secrets/hh_client_secret.txt
  yoomoney_client_id:
    file: ./secrets/yoomoney_client_id.txt
  yoomoney_client_secret:
    file: ./secrets/yoomoney_client_secret.txt



volumes:
  pgdata: {}
  redisdata: {}
  botlogs: {}
  web_logs: {}
  resumes: {}
