name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check backend
      - run: mypy backend
      - run: bash scripts/smoke_alembic.sh
      - run: uvx pytest -m "not pg" -q

  pg-integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: unit-sqlite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install -r requirements.txt -r requirements-dev.txt
      - run: bash scripts/smoke_alembic.sh
      - run: uvx pytest -m pg -q
