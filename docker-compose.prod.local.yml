services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: hh-bot-web:local
    env_file: [ .env ]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_PORT: ${WEB_PORT:-8000}
      APP_MODULE: ${APP_MODULE:-backend.app.main:app}

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    image: hh-bot-bot:local
    env_file: [ .env ]
    environment:
      BOT_LOG_DIR: /var/log/app
      BOT_LOG_FILE: /var/log/app/bot.log
